description: >-
  Tekton is open-source software (Apache License 2.0). There is no commercial billing surface published by the Tekton project itself — there are no invoices, no metered usage charges, and no subscription fees attributable to Tekton. Operating costs flow entirely through the operator's own Kubernetes infrastructure providers (worker-node compute consumed by TaskRun/PipelineRun pods, persistent volumes for workspaces, image-registry storage, ingress, observability, and any cloud-side OCI registries used by Chains). Commercial managed offerings exist (Red Hat OpenShift Pipelines, IBM Cloud Continuous Delivery, Tekton via various cloud platforms) and have their own billing surfaces that should be profiled against the third-party vendor — not Tekton.
notes: >-
  Open source — no commercial billing surface; commercial offerings handled by 3rd parties (Red Hat OpenShift Pipelines, IBM Cloud Continuous Delivery, Tekton via cloud platforms). reconciled=false explicitly indicates that no Tekton-issued bill exists rather than incomplete data. The principles below describe how to FinOps-manage the underlying infrastructure cost of operating self-hosted Tekton.
