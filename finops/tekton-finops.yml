principles:
  - name: Visibility
    description: >-
      No Tekton invoice exists. Treat self-hosted Tekton as a Kubernetes workload — the cost is the underlying compute consumed by TaskRun/PipelineRun pods (often bursty), persistent storage for workspaces, image pulls, OCI artifact pushes, ingress for EventListeners, and the database backing Tekton Results. All of these appear on the cloud provider's FOCUS-formatted bill.
  - name: Allocation
    description: >-
      Tag PipelineRun and TaskRun pods by team / repository / commit-author via Tekton's labels and annotations and propagate them to your cloud-provider tagging strategy. Tekton Results storage costs can be allocated by namespace.
  - name: Optimization
    description: >-
      Use spot/preemptible nodes for short-lived TaskRun pods; right-size step container resource requests; cache image layers via local registry mirrors; use the Hub/Bundles resolver to avoid re-bundling Tasks; expire old Results data; consolidate small Tekton installations onto a shared cluster with namespace-level RBAC and ResourceQuotas.
  - name: Accountability
    description: >-
      Assign a platform-engineering owner; review monthly Kubernetes-cluster cost attributable to tekton-pipelines and PipelineRun namespaces; benchmark managed Tekton (e.g., OpenShift Pipelines) versus self-hosting before signing a vendor contract.
