description: >-
  Tekton is open-source software (Apache License 2.0) and a CNCF Incubating project. There is no commercial billing surface published by the Tekton project itself — the software is free to download, install, and run on any Kubernetes cluster. Commercial offerings layered on Tekton (Red Hat OpenShift Pipelines, IBM Cloud Continuous Delivery, Jenkins X, Pipelines-as-Code on managed cloud platforms) are provided by 3rd-party vendors and have their own billing surfaces. Those vendor plans are out of scope of this Tekton profile.
notes: >-
  Open source — no commercial billing surface; commercial offerings are handled by 3rd parties (Red Hat OpenShift Pipelines, IBM Cloud Continuous Delivery, Tekton via cloud platforms). reconciled=false explicitly indicates that no Tekton-issued pricing exists rather than that the data is incomplete.
sources:
  - https://tekton.dev/
  - https://github.com/tektoncd/pipeline/blob/main/LICENSE
  - https://www.cncf.io/projects/tekton/
plans:
  - id: tekton-open-source
    name: Open Source (Apache 2.0)
    type: free
    description: >-
      Tekton Pipelines, Triggers, Chains, Results, Operator, Dashboard, CLI, Catalog, and Hub are licensed under Apache 2.0 and are freely available. Users provide their own Kubernetes cluster; running Tekton incurs only the underlying Kubernetes infrastructure cost.
    entries:
      - label: License
        name: license
        type: flat
        metric: cluster
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 0
        currency: USD
        userMultiplied: false
    elements:
      - name: Apache 2.0 License
      - name: CNCF Incubating Project
      - name: All Components Included
  - id: tekton-third-party-managed
    name: Third-Party Distributions and Managed Offerings (Reference)
    type: external
    description: >-
      Several vendors distribute or host Tekton with their own pricing — most notably Red Hat OpenShift Pipelines, IBM Cloud Continuous Delivery, and Pipelines-as-Code via various cloud platforms. Pricing is set and disclosed by those vendors, not by the Tekton project.
    entries:
      - label: Vendor-Set Pricing
        name: vendor_pricing
        type: external
        metric: vendor
        limit: -1
        timeFrame: contract
        geo: global
        unit: 1
        price: see_vendor
        currency: USD
        userMultiplied: false
    elements:
      - name: Red Hat OpenShift Pipelines
      - name: IBM Cloud Continuous Delivery
      - name: Pipelines-as-Code via Cloud Platforms
